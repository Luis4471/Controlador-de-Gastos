<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlador de Gastos</title>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-black: rgba(0, 0, 0, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-gray-400: rgba(119, 124, 124, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-brown-600: rgba(94, 82, 64, 1);
            --color-charcoal-700: rgba(31, 33, 33, 1);
            --color-charcoal-800: rgba(38, 40, 40, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-400: rgba(45, 166, 178, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-red-400: rgba(255, 84, 89, 1);
            --color-red-500: rgba(192, 21, 47, 1);
            --color-orange-400: rgba(230, 129, 97, 1);
            --color-orange-500: rgba(168, 75, 47, 1);

            --color-brown-600-rgb: 94, 82, 64;
            --color-teal-500-rgb: 33, 128, 141;
            --color-red-500-rgb: 192, 21, 47;

            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --color-error: var(--color-red-500);
            --color-success: var(--color-teal-500);
            --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);

            --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-size-sm: 12px;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --font-weight-bold: 600;

            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;

            --radius-base: 8px;
            --radius-md: 10px;
            --radius-lg: 12px;

            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-gray-400-rgb: 119, 124, 124;
                --color-teal-300-rgb: 50, 184, 198;
                --color-gray-300-rgb: 167, 169, 169;
                --color-gray-200-rgb: 245, 245, 245;

                --color-background: var(--color-charcoal-700);
                --color-surface: var(--color-charcoal-800);
                --color-text: var(--color-gray-200);
                --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
                --color-primary: var(--color-teal-300);
                --color-primary-hover: var(--color-teal-400);
                --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
                --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
                --color-border: rgba(var(--color-gray-400-rgb), 0.3);
                --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
                --color-error: var(--color-red-400);
                --color-success: var(--color-teal-300);
                --color-focus-ring: rgba(var(--color-teal-300-rgb), 0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            font-size: var(--font-size-base);
            background-color: var(--color-background);
            color: var(--color-text);
            padding: var(--space-20);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: var(--space-24);
        }

        h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
            margin-bottom: var(--space-8);
        }

        .header-stats {
            display: flex;
            gap: var(--space-16);
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-md);
            padding: var(--space-16);
            flex: 1;
            min-width: 200px;
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-4);
            font-weight: var(--font-weight-medium);
        }

        .stat-value {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }

        .stat-value.negative {
            color: var(--color-error);
        }

        .stat-value.positive {
            color: var(--color-success);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-24);
            margin-bottom: var(--space-24);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            box-shadow: var(--shadow-md);
        }

        .card h2 {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-16);
            color: var(--color-text);
        }

        .form-group {
            margin-bottom: var(--space-16);
        }

        label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
            margin-bottom: var(--space-8);
        }

        input, select {
            width: 100%;
            padding: var(--space-8) var(--space-12);
            font-size: var(--font-size-base);
            color: var(--color-text);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-family: var(--font-family-base);
        }

        input:focus, select:focus {
            outline: 2px solid var(--color-primary);
            border-color: var(--color-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-16);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: var(--font-family-base);
        }

        .btn-primary {
            background: var(--color-primary);
            color: var(--color-cream-100);
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-secondary {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: var(--color-secondary-hover);
        }

        .btn-full {
            width: 100%;
        }

        .expense-list {
            list-style: none;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-12);
            border-bottom: 1px solid var(--color-border);
        }

        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-info {
            flex: 1;
        }

        .expense-description {
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
            margin-bottom: var(--space-4);
        }

        .expense-meta {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .expense-amount {
            font-weight: var(--font-weight-bold);
            font-size: var(--font-size-lg);
            color: var(--color-error);
            margin-right: var(--space-12);
        }

        .expense-delete {
            background: transparent;
            border: none;
            color: var(--color-error);
            cursor: pointer;
            padding: var(--space-4);
            font-size: var(--font-size-lg);
        }

        .expense-delete:hover {
            opacity: 0.7;
        }

        .category-breakdown {
            margin-top: var(--space-16);
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-8) 0;
            border-bottom: 1px solid var(--color-border);
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-name {
            font-weight: var(--font-weight-medium);
            color: var(--color-text);
        }

        .category-amount {
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-24);
            color: var(--color-text-secondary);
        }

        .filter-section {
            margin-bottom: var(--space-16);
            display: flex;
            gap: var(--space-12);
        }

        .filter-section select {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Controlador de Gastos</h1>
            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-label">Conta Normal</div>
                    <div class="stat-value" id="normalAccount">€0,00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Conta Poupança</div>
                    <div class="stat-value" id="savingsAccount">€0,00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Despesas Totais</div>
                    <div class="stat-value negative" id="totalExpenses">€0,00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Orçamento Mensal</div>
                    <div class="stat-value" id="monthlyBudget">€0,00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Saldo Restante</div>
                    <div class="stat-value positive" id="remaining">€0,00</div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>Adicionar Despesa</h2>
                <form id="expenseForm">
                    <div class="form-group">
                        <label for="description">Descrição</label>
                        <input type="text" id="description" placeholder="Ex: Supermercado, Gasolina..." required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Valor (€)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Alimentação">🍽️ Alimentação</option>
                            <option value="Transporte">🚗 Transporte</option>
                            <option value="Casa">🏠 Casa</option>
                            <option value="Saúde">⚕️ Saúde</option>
                            <option value="Educação">📚 Educação</option>
                            <option value="Entretenimento">🎮 Entretenimento</option>
                            <option value="Compras">🛍️ Compras</option>
                            <option value="Outros">📌 Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Data</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Adicionar Despesa</button>
                </form>

                <div class="form-group" style="margin-top: var(--space-24);">
                    <label for="budget">Definir Orçamento Mensal (€)</label>
                    <input type="number" id="budget" step="0.01" min="0" placeholder="0,00">
                    <button type="button" class="btn btn-secondary btn-full" style="margin-top: var(--space-8);" onclick="setBudget()">Guardar Orçamento</button>
                </div>

                <div class="form-group" style="margin-top: var(--space-16);">
                    <label for="normalAccountInput">Saldo Conta Normal (€)</label>
                    <input type="number" id="normalAccountInput" step="0.01" min="0" placeholder="0,00">
                    <button type="button" class="btn btn-secondary btn-full" style="margin-top: var(--space-8);" onclick="setNormalAccount()">Guardar Saldo</button>
                </div>

                <div class="form-group" style="margin-top: var(--space-16);">
                    <label for="savingsAccountInput">Saldo Conta Poupança (€)</label>
                    <input type="number" id="savingsAccountInput" step="0.01" min="0" placeholder="0,00">
                    <button type="button" class="btn btn-secondary btn-full" style="margin-top: var(--space-8);" onclick="setSavingsAccount()">Guardar Saldo</button>
                </div>
            </div>

            <div class="card">
                <h2>Resumo por Categoria</h2>
                <div class="category-breakdown" id="categoryBreakdown">
                    <div class="empty-state">Sem despesas registadas</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Histórico de Despesas</h2>
            <div class="filter-section">
                <select id="filterCategory" onchange="filterExpenses()">
                    <option value="">Todas as categorias</option>
                    <option value="Alimentação">🍽️ Alimentação</option>
                    <option value="Transporte">🚗 Transporte</option>
                    <option value="Casa">🏠 Casa</option>
                    <option value="Saúde">⚕️ Saúde</option>
                    <option value="Educação">📚 Educação</option>
                    <option value="Entretenimento">🎮 Entretenimento</option>
                    <option value="Compras">🛍️ Compras</option>
                    <option value="Outros">📌 Outros</option>
                </select>
                <select id="filterMonth" onchange="filterExpenses()">
                    <option value="">Todos os meses</option>
                </select>
            </div>
            <ul class="expense-list" id="expenseList">
                <li class="empty-state">Nenhuma despesa adicionada ainda</li>
            </ul>
        </div>
    </div>

    <script>
        let expenses = [];
        let monthlyBudget = 0;
        let normalAccount = 0;
        let savingsAccount = 0;

        function loadData() {
            const saved = localStorage.getItem('expenseTrackerData');
            if (saved) {
                const data = JSON.parse(saved);
                expenses = data.expenses || [];
                monthlyBudget = data.monthlyBudget || 0;
                normalAccount = data.normalAccount || 0;
                savingsAccount = data.savingsAccount || 0;
            }
        }

        function saveData() {
            const data = {
                expenses,
                monthlyBudget,
                normalAccount,
                savingsAccount
            };
            localStorage.setItem('expenseTrackerData', JSON.stringify(data));
        }

        function init() {
            loadData();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            updateMonthFilter();
            render();
        }

        function setBudget() {
            const budgetInput = document.getElementById('budget');
            const value = parseFloat(budgetInput.value);
            if (value && value >= 0) {
                monthlyBudget = value;
                budgetInput.value = '';
                saveData();
                render();
            }
        }

        function setNormalAccount() {
            const accountInput = document.getElementById('normalAccountInput');
            const value = parseFloat(accountInput.value);
            if (!isNaN(value) && value >= 0) {
                normalAccount = value;
                accountInput.value = '';
                saveData();
                render();
            }
        }

        function setSavingsAccount() {
            const accountInput = document.getElementById('savingsAccountInput');
            const value = parseFloat(accountInput.value);
            if (!isNaN(value) && value >= 0) {
                savingsAccount = value;
                accountInput.value = '';
                saveData();
                render();
            }
        }

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
    e.preventDefault();
    
    const description = document.getElementById('description').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const date = document.getElementById('date').value;

    const expense = {
        id: Date.now(),
        description,
        amount,
        category,
        date
    };

    // ✅ NOVA FUNCIONALIDADE: Subtrair da Conta Normal
    normalAccount = Math.max(0, normalAccount - amount);  // Não deixa ficar negativo

    expenses.push(expense);
    expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

    e.target.reset();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    updateMonthFilter();
    saveData();
    render();
});

        function deleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            saveData();
            render();
        }

        window.deleteExpense = deleteExpense;

        function oldDeleteExpense(id) {
            expenses = expenses.filter(exp => exp.id !== id);
            render();
        }

        function filterExpenses() {
            const categoryFilter = document.getElementById('filterCategory').value;
            const monthFilter = document.getElementById('filterMonth').value;

            let filtered = expenses;

            if (categoryFilter) {
                filtered = filtered.filter(exp => exp.category === categoryFilter);
            }

            if (monthFilter) {
                filtered = filtered.filter(exp => {
                    const expDate = new Date(exp.date);
                    return `${expDate.getFullYear()}-${String(expDate.getMonth() + 1).padStart(2, '0')}` === monthFilter;
                });
            }

            renderExpenseList(filtered);
        }

        function updateMonthFilter() {
            const monthFilter = document.getElementById('filterMonth');
            const months = new Set();

            expenses.forEach(exp => {
                const date = new Date(exp.date);
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                months.add(monthKey);
            });

            const sortedMonths = Array.from(months).sort().reverse();
            
            const currentValue = monthFilter.value;
            monthFilter.innerHTML = '<option value="">Todos os meses</option>';
            
            sortedMonths.forEach(month => {
                const [year, monthNum] = month.split('-');
                const date = new Date(year, monthNum - 1);
                const monthName = date.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
                const option = document.createElement('option');
                option.value = month;
                option.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);
                monthFilter.appendChild(option);
            });

            if (currentValue && sortedMonths.includes(currentValue)) {
                monthFilter.value = currentValue;
            }
        }

        function render() {
            const total = expenses.reduce((sum, exp) => sum + exp.amount, 0);
            const remaining = monthlyBudget - total;

            document.getElementById('normalAccount').textContent = `€${normalAccount.toFixed(2)}`;
            document.getElementById('savingsAccount').textContent = `€${savingsAccount.toFixed(2)}`;
            document.getElementById('totalExpenses').textContent = `€${total.toFixed(2)}`;
            document.getElementById('monthlyBudget').textContent = `€${monthlyBudget.toFixed(2)}`;
            document.getElementById('remaining').textContent = `€${remaining.toFixed(2)}`;

            const remainingEl = document.getElementById('remaining');
            remainingEl.className = 'stat-value';
            if (remaining < 0) {
                remainingEl.classList.add('negative');
            } else {
                remainingEl.classList.add('positive');
            }

            renderCategoryBreakdown();
            filterExpenses();
        }

        function renderCategoryBreakdown() {
            const breakdown = {};
            
            expenses.forEach(exp => {
                if (!breakdown[exp.category]) {
                    breakdown[exp.category] = 0;
                }
                breakdown[exp.category] += exp.amount;
            });

            const categoryBreakdown = document.getElementById('categoryBreakdown');
            
            if (Object.keys(breakdown).length === 0) {
                categoryBreakdown.innerHTML = '<div class="empty-state">Sem despesas registadas</div>';
                return;
            }

            const sortedCategories = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);

            categoryBreakdown.innerHTML = sortedCategories.map(([category, amount]) => `
                <div class="category-item">
                    <span class="category-name">${getCategoryIcon(category)} ${category}</span>
                    <span class="category-amount">€${amount.toFixed(2)}</span>
                </div>
            `).join('');
        }

        function renderExpenseList(expensesToShow) {
            const expenseList = document.getElementById('expenseList');

            if (expensesToShow.length === 0) {
                expenseList.innerHTML = '<li class="empty-state">Nenhuma despesa encontrada</li>';
                return;
            }

            expenseList.innerHTML = expensesToShow.map(exp => `
                <li class="expense-item">
                    <div class="expense-info">
                        <div class="expense-description">${exp.description}</div>
                        <div class="expense-meta">${getCategoryIcon(exp.category)} ${exp.category} • ${formatDate(exp.date)}</div>
                    </div>
                    <span class="expense-amount">€${exp.amount.toFixed(2)}</span>
                    <button class="expense-delete" onclick="deleteExpense(${exp.id})" aria-label="Eliminar despesa">✕</button>
                </li>
            `).join('');
        }

        function getCategoryIcon(category) {
            const icons = {
                'Alimentação': '🍽️',
                'Transporte': '🚗',
                'Casa': '🏠',
                'Saúde': '⚕️',
                'Educação': '📚',
                'Entretenimento': '🎮',
                'Compras': '🛍️',
                'Outros': '📌'
            };
            return icons[category] || '📌';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        init();
    </script>
</body>
</html>
